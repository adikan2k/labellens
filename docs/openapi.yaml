openapi: 3.1.0
info:
  title: LabelLens API
  version: 0.1.0
  summary: Search, explain and compare US packaged foods from Open Food Facts.
  description: |
    The contract between `api/` and `web/` (docs/SPEC.md section 6). Both sides build against
    this file; a change here comes first.

    Every JSON response carries a `source` block naming the Open Food Facts snapshot. Field names
    follow the dbt marts in docs/SPEC.md section 5. Missing values are `null`, never omitted.
  license:
    name: ODbL-1.0 (data); code licence in the repository
    url: https://opendatacommons.org/licenses/odbl/1-0/

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: products
  - name: stats
  - name: graph
  - name: ask
  - name: meta

paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Status and versions
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /search:
    get:
      tags: [products]
      operationId: searchProducts
      summary: Products ranked by name, brand and barcode match
      parameters:
        - name: q
          in: query
          required: true
          description: Product name, brand or barcode.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching products, best first. An empty list when nothing matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /products/{code}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Full product with nutrition, additives and ingredients
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /products/{code}/swaps:
    get:
      tags: [products]
      operationId: getSwaps
      summary: Better products in the same category, each with a data-built reason
      parameters:
        - $ref: "#/components/parameters/Code"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: Swaps ranked by Nutri-Score, then fewest additives. May be empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwapsResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stats/overview:
    get:
      tags: [stats]
      operationId: getStatsOverview
      summary: Counts and distributions for the dashboard
      responses:
        "200":
          description: Dashboard figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsOverview" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /graph/neighborhood:
    get:
      tags: [graph]
      operationId: getGraphNeighborhood
      summary: Nodes and edges around a product
      parameters:
        - name: code
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Barcode" }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 2, default: 1 }
      responses:
        "200":
          description: The neighbourhood, capped in size; `truncated` says whether it was cut.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphNeighborhood" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /ask:
    post:
      tags: [ask]
      operationId: ask
      summary: Ask a question; agent steps stream as server-sent events
      description: |
        Streams `text/event-stream`. Event names and payloads:

        - `step`: one per tool call, as it happens (schema `AskStep`). At most 6.
        - `answer`: once, last (schema `AskAnswer`). `refused` is true for medical or dietary
          advice; `replay` is true when the daily spend cap is reached and a cached example run
          is served instead.
        - `error`: once, last, instead of `answer` (schema `AskError`).

        The rate limit (10 questions per IP per hour) is checked before the stream opens and
        answers 429 as JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events named `step`, `answer` or `error`.
          x-sse-events:
            step: { $ref: "#/components/schemas/AskStep" }
            answer: { $ref: "#/components/schemas/AskAnswer" }
            error: { $ref: "#/components/schemas/AskError" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "429":
          description: Rate limit reached for this IP.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until another question is accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /additives:
    get:
      tags: [additives]
      operationId: listAdditives
      summary: Every additive at least one named US product lists, most common first
      responses:
        "200":
          description: The additives.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdditiveList" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /additives/{slug}:
    get:
      tags: [additives]
      operationId: getAdditive
      summary: One additive, for the additive guide
      description: |
        What it is (the explainer, written by AI from Open Food Facts' taxonomy), whether Open
        Food Facts flags it, how many named US products list it, the categories that use it
        most, and up to six example products, best-ranked first. The slug is the Open Food
        Facts id without "en:" (e330); other ids are used whole.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120, example: e330 }
      responses:
        "200":
          description: The additive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdditiveGuide" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /label:
    post:
      tags: [label]
      operationId: readLabel
      summary: Read a food label from one or two photos, and explain it from the data
      description: |
        Claude (the default model in config) reads the photos into structured data: name,
        brand, barcode, nutrition as printed, ingredients and additives. LabelLens converts the
        nutrition to per 100 g in code, adds its explainers and the Open Food Facts
        overexposure flag, finds the product the label most likely is (by barcode, else by
        brand and name when the words agree), and suggests swaps or well-graded products.

        The photos go to Anthropic to be read and are not stored. Limits: 10 reads per IP per
        hour, counted apart from questions; reads share the daily spend cap with /ask, and
        past it this answers 503.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 2
                  description: JPEG, PNG or WebP, by their bytes; 5 MB each at most.
                  items: { type: string, format: binary }
      responses:
        "200":
          description: The label as read, and what LabelLens adds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelResponse" }
        "413":
          description: The upload is larger than two 5 MB photos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "429":
          description: Label read limit reached for this IP.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until another read is accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /warm:
    get:
      tags: [health]
      operationId: getWarm
      summary: Build the lazy services, for the scheduled keep-warm ping
      description: |
        Builds the ask agent and the label reader if they are not built yet, so the first
        question or label on a new instance does not wait for their libraries. Runs no database
        query (a ping never wakes the database) and no model call. The source's snapshot
        date is null until another request has read it.
      responses:
        "200":
          description: Which lazy services are configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Warm" }

  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: What a demo has left, after waking the lazy services
      description: |
        Builds the ask agent and the label reader if they are not built yet (their libraries
        are slow to import on a cold instance) and reports today's spend against the cap and
        this IP's remaining questions and label reads this hour. No model call.
      responses:
        "200":
          description: Ready state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /mcp:
    post:
      tags: [meta]
      operationId: mcp
      summary: MCP endpoint (streamable HTTP)
      description: |
        Model Context Protocol server, stateless streamable HTTP per the MCP 2026-07-28
        specification. Public, read-only, unauthenticated and rate-limited per IP. Tools:
        `search_products`, `get_product`, `find_swaps`, `explain_additive`. `get_product` and
        `find_swaps` declare a `ui://` resource under the MCP Apps extension. Requests and
        responses are JSON-RPC as defined by MCP, not by this file.
      x-mcp: true
      responses:
        "200":
          description: JSON-RPC response, or an event stream, as MCP defines.

components:
  parameters:
    Code:
      name: code
      in: path
      required: true
      description: Product barcode as recorded by Open Food Facts.
      schema: { $ref: "#/components/schemas/Barcode" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }

  responses:
    NotFound:
      description: No product with this barcode in the snapshot.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: A parameter is missing or out of range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: >
        The database cannot answer right now, usually because it is waking from idle.
        The web shows "Search is waking up. Try again in a few seconds."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Source:
      type: object
      description: Attribution carried by every response.
      required: [name, url, licence, licence_url, snapshot_date]
      properties:
        name: { type: string, const: Open Food Facts }
        url: { type: string, format: uri, example: "https://world.openfoodfacts.org" }
        licence: { type: string, const: ODbL-1.0 }
        licence_url:
          type: string
          format: uri
          example: "https://opendatacommons.org/licenses/odbl/1-0/"
        snapshot_date:
          type: [string, "null"]
          format: date
          description: Date of the Open Food Facts snapshot the data comes from.

    Error:
      type: object
      required: [detail, source]
      properties:
        detail: { type: string, description: What failed and what to do. }
        source: { $ref: "#/components/schemas/Source" }

    Versions:
      type: object
      required: [api, python]
      properties:
        api: { type: string }
        python: { type: string }

    Health:
      type: object
      required: [status, versions, source]
      properties:
        status: { type: string, const: ok }
        versions: { $ref: "#/components/schemas/Versions" }
        source: { $ref: "#/components/schemas/Source" }

    Barcode:
      type: string
      minLength: 1
      maxLength: 32
      description: Open Food Facts `code`. Kept as a string; leading zeros matter.

    NutriscoreGrade:
      type: [string, "null"]
      enum: [a, b, c, d, e, null]

    NovaGroup:
      type: [integer, "null"]
      enum: [1, 2, 3, 4, null]

    ProductSummary:
      type: object
      required:
        [code, name, brand, category_main, nutriscore_grade, nova_group, image_url]
      properties:
        code: { $ref: "#/components/schemas/Barcode" }
        name: { type: [string, "null"] }
        brand: { type: [string, "null"] }
        category_main: { type: [string, "null"], description: "`category_id` from dim_categories." }
        nutriscore_grade: { $ref: "#/components/schemas/NutriscoreGrade" }
        nova_group: { $ref: "#/components/schemas/NovaGroup" }
        image_url:
          type: [string, "null"]
          format: uri
          description: Linked from Open Food Facts, never re-hosted.

    SearchResult:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required: [match]
          properties:
            match:
              type: string
              enum: [barcode, name, brand]
              description: Which field matched best.

    SearchResponse:
      type: object
      required: [query, results, source]
      properties:
        query: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        source: { $ref: "#/components/schemas/Source" }

    Nutrition:
      type: object
      description: Per 100 g. `null` where Open Food Facts has no value.
      required:
        [energy_kcal_100g, sugars_100g, salt_100g, fat_100g, saturated_fat_100g, fiber_100g,
         proteins_100g]
      properties:
        energy_kcal_100g: { type: [number, "null"], minimum: 0, maximum: 900 }
        sugars_100g: { type: [number, "null"], minimum: 0, maximum: 100 }
        salt_100g: { type: [number, "null"], minimum: 0, maximum: 100 }
        fat_100g: { type: [number, "null"], minimum: 0, maximum: 100 }
        saturated_fat_100g: { type: [number, "null"], minimum: 0, maximum: 100 }
        fiber_100g: { type: [number, "null"], minimum: 0, maximum: 100 }
        proteins_100g: { type: [number, "null"], minimum: 0, maximum: 100 }

    Explainer:
      type: [object, "null"]
      required: [text, ai_generated]
      properties:
        text: { type: string }
        ai_generated:
          type: boolean
          description: When true, the UI shows "Written by AI from Open Food Facts data."

    Additive:
      type: object
      required: [additive_id, e_number, name, function, explainer, flagged]
      properties:
        additive_id: { type: string, example: "en:e330" }
        e_number: { type: [string, "null"], example: E330 }
        name: { type: string, example: Citric acid }
        function:
          type: [string, "null"]
          description: What it does, from Open Food Facts' additives taxonomy.
          example: Antioxidant, sequestrant
        explainer: { $ref: "#/components/schemas/Explainer" }
        flagged:
          type: boolean
          description: >-
            Open Food Facts marks it as a high overexposure risk (EFSA). Swaps never
            contain one.

    Ingredient:
      type: object
      required: [ingredient_id, name, rank, explainer]
      properties:
        ingredient_id: { type: string }
        name: { type: string }
        rank:
          type: integer
          minimum: 1
          description: Order on the label among recognised ingredients, 1 first.
        explainer: { $ref: "#/components/schemas/Explainer" }

    Product:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required:
            [category_name, category_source, completeness, nutrition, additives, ingredients,
             off_url, in_graph]
          properties:
            category_name:
              type: [string, "null"]
              description: Display name of category_main.
            category_source:
              type: [string, "null"]
              enum: [off_tags, model, null]
              description: >
                Where category_main came from: Open Food Facts' own category tags, or the
                model (phase 3 enrichment) when the tags give none. The UI marks `model` as
                suggested by AI.
            completeness: { type: [number, "null"], minimum: 0, maximum: 1 }
            nutrition: { $ref: "#/components/schemas/Nutrition" }
            additives:
              type: array
              items: { $ref: "#/components/schemas/Additive" }
            ingredients:
              type: array
              items: { $ref: "#/components/schemas/Ingredient" }
            off_url:
              type: string
              format: uri
              description: The product's page on Open Food Facts.
            in_graph:
              type: boolean
              description: >
                Whether the food graph holds this product (the most complete graded products),
                so the explorer can open its neighbourhood.

    ProductResponse:
      type: object
      required: [product, source]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        source: { $ref: "#/components/schemas/Source" }

    Swap:
      type: object
      required: [product, reason, additive_count]
      properties:
        product: { $ref: "#/components/schemas/ProductSummary" }
        reason:
          type: string
          description: One line built from the data, not from a model.
          example: Same category, Nutri-Score A instead of C, no flagged additives.
        additive_count: { type: integer, minimum: 0 }

    SwapsResponse:
      type: object
      required: [code, swaps, source]
      properties:
        code: { $ref: "#/components/schemas/Barcode" }
        swaps:
          type: array
          items: { $ref: "#/components/schemas/Swap" }
        source: { $ref: "#/components/schemas/Source" }

    CountByKey:
      type: object
      required: [key, label, count]
      properties:
        key: { type: [string, "null"], description: "Grade, NOVA group or id; `null` for unknown." }
        label: { type: string }
        count: { type: integer, minimum: 0 }

    CategoryGrades:
      type: object
      description: Nutri-Score spread within one category, graded products only.
      required: [category_id, name, graded_count, grades]
      properties:
        category_id: { type: string }
        name: { type: string }
        graded_count: { type: integer, minimum: 0 }
        grades:
          type: object
          required: [a, b, c, d, e]
          properties:
            a: { type: integer, minimum: 0 }
            b: { type: integer, minimum: 0 }
            c: { type: integer, minimum: 0 }
            d: { type: integer, minimum: 0 }
            e: { type: integer, minimum: 0 }

    CategoryMedian:
      type: object
      description: Median of one nutrient per 100 g within a category.
      required: [category_id, name, median, product_count]
      properties:
        category_id: { type: string }
        name: { type: string }
        median: { type: number, minimum: 0 }
        product_count:
          type: integer
          minimum: 0
          description: Products in the category with a value for the nutrient.

    StatsOverview:
      type: object
      required:
        [product_count, named_product_count, brand_count, category_count, additive_count,
         nutriscore, nova, categories, category_sources, top_additives, nutriscore_by_category,
         median_sugars_by_category, source]
      properties:
        product_count: { type: integer, minimum: 0 }
        named_product_count:
          type: integer
          minimum: 0
          description: Products with a name, which is what search can find.
        brand_count: { type: integer, minimum: 0 }
        category_count: { type: integer, minimum: 0 }
        additive_count: { type: integer, minimum: 0 }
        nutriscore:
          type: array
          description: Products per Nutri-Score grade, a to e, then unknown.
          items: { $ref: "#/components/schemas/CountByKey" }
        nova:
          type: array
          description: Products per NOVA group, 1 to 4, then unknown.
          items: { $ref: "#/components/schemas/CountByKey" }
        categories:
          type: array
          description: Products per category in our taxonomy, without "Other or unclear".
          items: { $ref: "#/components/schemas/CountByKey" }
        category_sources:
          type: array
          description: >
            Named products by where their category came from: `off_tags`, `model`, and
            `null` for none.
          items: { $ref: "#/components/schemas/CountByKey" }
        top_additives:
          type: array
          description: Most common additives by number of products.
          items: { $ref: "#/components/schemas/CountByKey" }
        nutriscore_by_category:
          type: array
          description: Nutri-Score spread per category, categories with enough graded products.
          items: { $ref: "#/components/schemas/CategoryGrades" }
        median_sugars_by_category:
          type: array
          description: Median sugars per 100 g per category.
          items: { $ref: "#/components/schemas/CategoryMedian" }
        source: { $ref: "#/components/schemas/Source" }

    GraphNode:
      type: object
      required: [id, kind, name, nutriscore_grade, detail]
      properties:
        id:
          type: string
          description: Kind and key, e.g. "Product:0016000275287" or "Brand:general mills".
        kind: { type: string, enum: [Product, Brand, Category, Additive, Ingredient] }
        name: { type: string }
        nutriscore_grade: { $ref: "#/components/schemas/NutriscoreGrade" }
        detail:
          type: [string, "null"]
          description: >
            For additives and ingredients, their explainer (written by AI from Open Food
            Facts data); otherwise null.

    GraphEdge:
      type: object
      required: [from, to, type]
      properties:
        from: { type: string, description: Node id. }
        to: { type: string, description: Node id. }
        type: { type: string, enum: [MADE_BY, IN, CONTAINS, HAS_INGREDIENT, CHILD_OF] }

    GraphNeighborhood:
      type: object
      required: [center, nodes, edges, truncated, source]
      properties:
        center: { type: string, description: Node id of the product. }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/GraphNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/GraphEdge" }
        truncated: { type: boolean }
        source: { $ref: "#/components/schemas/Source" }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 500 }

    AskStep:
      type: object
      required: [index, tool, summary, row_count, duration_ms]
      properties:
        index: { type: integer, minimum: 1, maximum: 6 }
        tool: { type: string, enum: [query_sql, query_graph, search_explainers] }
        summary: { type: string, description: What it looked up, in plain words. }
        row_count: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }

    Citation:
      type: object
      required: [n, kind, ref, label, url]
      properties:
        n: { type: integer, minimum: 1, description: The number shown in the answer. }
        kind: { type: string, enum: [row, node, explainer] }
        ref: { type: string, description: Barcode, node id or additive/ingredient id. }
        label: { type: string }
        url: { type: [string, "null"], description: App link for the citation. }

    AskAnswer:
      type: object
      required: [text, citations, refused, replay, source]
      properties:
        text: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        refused: { type: boolean }
        replay: { type: boolean }
        source: { $ref: "#/components/schemas/Source" }

    AskError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [timeout, tool_failed, internal] }
        message: { type: string }

    LabelIngredient:
      description: >-
        An ingredient as printed. ingredient_id is ours when LabelLens knows the ingredient
        (it may then have an explainer), else label:<rank>.
      allOf:
        - $ref: "#/components/schemas/Ingredient"

    LabelRead:
      type: object
      required: [name, brand, barcode, category_id, category_name, basis, serving_size_g,
                 conversion_note, nutrition, ingredients, additives, unmatched_additives]
      properties:
        name: { type: [string, "null"] }
        brand: { type: [string, "null"] }
        barcode: { type: [string, "null"], description: Digits read from the photo, if any. }
        category_id: { type: string, description: A leaf of the category taxonomy, or other. }
        category_name: { type: [string, "null"] }
        basis: { type: string, enum: [per_100g, per_serving, unknown] }
        serving_size_g: { type: [number, "null"] }
        conversion_note:
          type: [string, "null"]
          example: Converted from per serving (30 g or ml) to per 100 g or ml.
        nutrition: { $ref: "#/components/schemas/Nutrition" }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/LabelIngredient" }
        additives:
          type: array
          items: { $ref: "#/components/schemas/Additive" }
        unmatched_additives:
          type: array
          items: { type: string }
          description: Additives read from the label that LabelLens has no entry for.

    LabelMatch:
      type: object
      required: [how, product]
      properties:
        how: { type: string, enum: [barcode, name] }
        product: { $ref: "#/components/schemas/Product" }

    LabelResponse:
      type: object
      required: [is_food_label, label, match, suggestions, suggestions_kind, source]
      properties:
        is_food_label: { type: boolean }
        label:
          oneOf:
            - $ref: "#/components/schemas/LabelRead"
            - type: "null"
        match:
          oneOf:
            - $ref: "#/components/schemas/LabelMatch"
            - type: "null"
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/Swap" }
        suggestions_kind:
          type: [string, "null"]
          enum: [swaps, category, null]
          description: >-
            Swaps for the matched product, or well-graded products in the label's category.
        source: { $ref: "#/components/schemas/Source" }

    Warm:
      type: object
      required: [ask_configured, label_configured, source]
      properties:
        ask_configured: { type: boolean }
        label_configured: { type: boolean }
        source: { $ref: "#/components/schemas/Source" }

    Ready:
      type: object
      required: [ask_configured, label_configured, questions_left, label_reads_left,
                 spent_today_usd, daily_cap_usd, source]
      properties:
        ask_configured: { type: boolean }
        label_configured: { type: boolean }
        questions_left: { type: integer, minimum: 0 }
        label_reads_left: { type: integer, minimum: 0 }
        spent_today_usd: { type: number, minimum: 0 }
        daily_cap_usd: { type: number }
        source: { $ref: "#/components/schemas/Source" }

    AdditiveListItem:
      type: object
      required: [additive_id, slug, e_number, name, function, flagged, product_count]
      properties:
        additive_id: { type: string, example: "en:e330" }
        slug: { type: string, example: e330 }
        e_number: { type: [string, "null"], example: E330 }
        name: { type: string, example: Citric acid }
        function: { type: [string, "null"] }
        flagged: { type: boolean }
        product_count: { type: integer, minimum: 0, description: Named US products that list it. }

    AdditiveList:
      type: object
      required: [additives, source]
      properties:
        additives:
          type: array
          items: { $ref: "#/components/schemas/AdditiveListItem" }
        source: { $ref: "#/components/schemas/Source" }

    CategoryUse:
      type: object
      required: [category_id, name, products]
      properties:
        category_id: { type: string }
        name: { type: string }
        products: { type: integer, minimum: 0 }

    AdditiveGuide:
      allOf:
        - $ref: "#/components/schemas/AdditiveListItem"
        - type: object
          required: [explainer, share_of_products, top_categories, examples, source]
          properties:
            explainer: { $ref: "#/components/schemas/Explainer" }
            share_of_products:
              type: number
              minimum: 0
              maximum: 1
              description: product_count as a share of all named US products.
            top_categories:
              type: array
              items: { $ref: "#/components/schemas/CategoryUse" }
            examples:
              type: array
              items: { $ref: "#/components/schemas/ProductSummary" }
            source: { $ref: "#/components/schemas/Source" }
