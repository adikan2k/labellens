<!doctype html>
<!--
  The link preview image (web/public/og.png), 1200 x 630, in the tokens of DESIGN.md.
  The label is a real one from the data: Old Fashioned Oats, Quaker Oats (0030000010402).
  To rebuild it, from the repository root:
    chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=web/public/og.png docs/design/og/og.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LabelLens link preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block">
<style>
  :root { --page: #f4efe6; --paper: #ffffff; --ink: #000000; --ink-muted: #6b6b6b; --grade-a: #038141; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--page); color: var(--ink); font-family: Archivo, system-ui, sans-serif; position: relative; }
  .left { position: absolute; left: 64px; top: 48px; width: 700px; }
  .mark { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 700; }
  .mark svg { height: 30px; width: auto; }
  h1 { font-size: 196px; line-height: 0.86; font-weight: 900; font-stretch: 62%; padding-top: 36px; letter-spacing: -1px; }
  .rule { height: 14px; background: var(--ink); margin-top: 32px; }
  .line { font-size: 36px; line-height: 1.2; font-weight: 500; padding-top: 24px; }
  .label { position: absolute; right: 64px; top: 58px; width: 330px; background: var(--paper); padding: 18px 18px 20px; transform: rotate(2deg); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 12px; }
  .name { font-size: 19px; font-weight: 700; font-stretch: 88%; }
  .brand { font-size: 16px; color: var(--ink-muted); }
  .chip { background: var(--grade-a); color: #fff; font-weight: 800; font-size: 18px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .panel { border: 2px solid var(--ink); padding: 10px 12px 12px; }
  .nf { font-size: 40px; font-weight: 900; font-stretch: 80%; line-height: 1; }
  .per { font-size: 15px; padding: 4px 0 10px; }
  .heavy { height: 10px; background: var(--ink); }
  .row { display: flex; justify-content: space-between; font-size: 18px; padding: 7px 0; border-bottom: 5px solid var(--ink); font-stretch: 88%; }
  .row.sub { border-bottom-width: 1px; }
  .row.thin { border-bottom-width: 1px; }
  .row b { font-weight: 800; }
  .row .in { padding-left: 16px; }
  .flags { font-size: 15px; font-weight: 600; padding-top: 12px; font-stretch: 88%; }
</style>
</head>
<body>
  <div class="left">
    <div class="mark">
      <svg viewBox="0 0 18 14" shape-rendering="crispEdges"><rect x="0" width="2" height="14"/><rect x="3" width="1" height="14"/><rect x="5" width="3" height="14"/><rect x="9" width="1" height="14"/><rect x="11" width="2" height="14"/><rect x="14" width="1" height="14"/><rect x="16" width="2" height="14"/></svg>
      LabelLens
    </div>
    <h1>What’s in&nbsp;it?</h1>
    <div class="rule"></div>
    <p class="line">A million US food labels, explained.</p>
  </div>
  <div class="label">
    <div class="head">
      <div><div class="name">Old Fashioned Oats</div><div class="brand">Quaker Oats</div></div>
      <div class="chip">A</div>
    </div>
    <div class="panel">
      <div class="nf">Nutrition Facts</div>
      <div class="per">Per 100 g</div>
      <div class="heavy"></div>
      <div class="row"><span>Energy</span><b>375 kcal</b></div>
      <div class="row thin"><span>Fat</span><b>7.5 g</b></div>
      <div class="row"><span class="in">Saturated fat</span><b>1.3 g</b></div>
      <div class="row"><span>Salt</span><b>0 g</b></div>
      <div class="row"><span>Fiber</span><b>10 g</b></div>
      <div class="row"><span>Sugars</span><b>2.5 g</b></div>
      <div class="row" style="border-bottom:0"><span>Protein</span><b>13 g</b></div>
      <div class="heavy"></div>
    </div>
    <p class="flags">Low in saturates · Low in sugars · Low in salt</p>
  </div>
</body>
</html>
