# Local Postgres for tests and development. Same image as CI and close to Neon (Postgres 17
# with pgvector). The credentials are local test values, not secrets.
#
#   docker compose up -d postgres
#   TEST_DATABASE_URL=postgresql://labellens:labellens@localhost:54329/labellens (the default)
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: labellens
      POSTGRES_PASSWORD: labellens
      POSTGRES_DB: labellens
    ports:
      - "54329:5432"
    volumes:
      - labellens-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labellens -d labellens"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  labellens-pg:
