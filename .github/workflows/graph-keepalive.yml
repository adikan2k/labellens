name: Graph keep-alive

# AuraDB Free pauses an instance after 72 hours without activity, and deletes one that stays
# paused for 30 days. A one-line read every 48 hours keeps the graph awake between visitors.
# Needs the repository secrets NEO4J_URI, NEO4J_USER and NEO4J_PASSWORD.

on:
  schedule:
    - cron: "23 8 */2 * *" # every other day, 08:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact tags only (no floating v10), so pin the commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups
      - name: Read one node
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          if [ -z "$NEO4J_URI" ]; then
            echo "::error::The NEO4J_* secrets are not set; the graph was not pinged."
            exit 1
          fi
          uv run python -m pipeline.load.graph --ping
