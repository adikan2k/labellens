name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image and port as docker-compose.yml; database tests fail (not skip) in CI.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: labellens
          POSTGRES_PASSWORD: labellens
          POSTGRES_DB: labellens
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U labellens -d labellens"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact tags only (no floating v10), so pin the commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check.py --only python

  web:
    name: Web (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: python3 scripts/check.py --only web
