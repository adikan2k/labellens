labellens:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to the repo root. Tests and Dagster pass an absolute path instead.
      path: "{{ env_var('LABELLENS_DUCKDB', 'data/labellens.duckdb') }}"
      threads: 4
      settings:
        preserve_insertion_order: false
        temp_directory: "{{ env_var('LABELLENS_DUCKDB_TMP', 'data/tmp') }}"
