version: 2

models:
  - name: dim_products
    description: One row per US barcode in the snapshot.
    data_tests:
      - row_count_between:
          arguments:
            min_rows: "{{ var('min_products') }}"
            max_rows: "{{ var('max_products') }}"
    columns:
      - name: code
        description: Open Food Facts barcode, kept as text (leading zeros matter).
        data_tests: [unique, not_null]
      - name: name
        description: Product name (main, then English, then any language), cleaned.
        data_tests:
          - max_null_share:
              arguments:
                max_share: "{{ var('max_unnamed_share') }}"
      - name: brand
        description: First brand listed.
      - name: category_main
        description: category_id from dim_categories; from category_map now, the model in phase 3.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_categories')
                field: category_id
      - name: category_source
        description: "'off_tags' when category_main came from category_map; null when unset."
        data_tests:
          - accepted_values:
              arguments:
                values: ["off_tags"]
      - name: nutriscore_grade
        description: a to e; Open Food Facts' 'unknown' and 'not-applicable' are null.
        data_tests:
          - accepted_values:
              arguments:
                values: ["a", "b", "c", "d", "e"]
      - name: nova_group
        description: NOVA processing group 1 to 4, or null.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: image_url
        description: Front image on images.openfoodfacts.org (linked, never re-hosted).
      - name: off_url
        description: The product's page on Open Food Facts.
        data_tests: [not_null]
      - name: completeness
        description: Open Food Facts' completeness score, 0 to 1.
        data_tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: fct_nutrition
    description: Per-100 g nutrition, one row per product. Impossible values are blanked.
    columns:
      - name: code
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: code
      - name: energy_kcal_100g
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 900}
      - name: sugars_100g
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}
      - name: salt_100g
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}
      - name: fat_100g
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}
      - name: saturated_fat_100g
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}
      - name: fiber_100g
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}
      - name: proteins_100g
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}

  - name: dim_additives
    description: Every additive used by at least one US product, with taxonomy facts.
    columns:
      - name: additive_id
        description: Open Food Facts id, e.g. en:e330.
        data_tests: [unique, not_null]
      - name: name
        description: English name from the taxonomy, else the E-number.
        data_tests: [not_null]
      - name: explainer
        description: Plain-English note, written once per additive in phase 3.

  - name: bridge_product_additives
    description: Which additives each product contains.
    data_tests:
      - unique_combination:
          arguments:
            columns: [code, additive_id]
    columns:
      - name: code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: code
      - name: additive_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_additives')
                field: additive_id

  - name: dim_ingredients
    description: Every recognised ingredient used by at least one US product.
    columns:
      - name: ingredient_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]

  - name: bridge_product_ingredients
    description: Recognised top-level ingredients per product, with label position.
    data_tests:
      - unique_combination:
          arguments:
            columns: [code, ingredient_id]
    columns:
      - name: code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: code
      - name: ingredient_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_ingredients')
                field: ingredient_id
      - name: rank
        description: Position on the label, 1 first.
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 1, max_value: 1000}
      - name: percent_estimate
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}
