version: 2

models:
  - name: int_product_tag_categories
    description: The category Open Food Facts' tags give a product, via category_map.
    columns:
      - name: code
        data_tests: [unique, not_null]
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_categories')
                field: category_id

  - name: int_category_inputs
    description: >
      The category model's input for every named product: name, brand, start of the
      ingredient list, and the tag category if Open Food Facts' tags give one.
    columns:
      - name: code
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: ingredients
        description: Label texts in order, at most 200 characters; null when none are listed.

  - name: int_product_barcodes
    description: >
      Whether each code is a real GS1 barcode (GTIN-8, -12, -13 or -14 with a correct check
      digit). Swaps offer only products whose code is; the rest are mostly restaurant menu
      items and shop-weighed goods with 16 to 24 digit codes.
    columns:
      - name: code
        data_tests: [unique, not_null]
      - name: gtin_valid
        data_tests: [not_null]

  - name: int_product_rank
    description: Search rank for every named product, shared by search and the graph subset.
    columns:
      - name: code
        data_tests: [unique, not_null]
      - name: rank_pos
        data_tests: [unique, not_null]

  - name: int_graph_products
    description: >
      The products the Neo4j graph holds: graded, named, with a real category, in rank order
      up to the relationship cap.
    columns:
      - name: code
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: code
      - name: relationships
        data_tests: [not_null]

unit_tests:
  - name: gtin_check_digits
    description: Real barcodes pass; wrong check digits, menu-item codes and non-digits fail.
    model: int_product_barcodes
    given:
      - input: ref('stg_off__products')
        rows:
          - {code: "0016000123991"}
          - {code: "0016000123992"}
          - {code: "04918202"}
          - {code: "04918203"}
          - {code: "028400516464"}
          - {code: "00028400516464"}
          - {code: "1417864589048008238"}
          - {code: "12345"}
          - {code: "abc12345"}
    expect:
      rows:
        - {code: "0016000123991", gtin_valid: true}
        - {code: "0016000123992", gtin_valid: false}
        - {code: "04918202", gtin_valid: true}
        - {code: "04918203", gtin_valid: false}
        - {code: "028400516464", gtin_valid: true}
        - {code: "00028400516464", gtin_valid: true}
        - {code: "1417864589048008238", gtin_valid: false}
        - {code: "12345", gtin_valid: false}
        - {code: "abc12345", gtin_valid: false}
