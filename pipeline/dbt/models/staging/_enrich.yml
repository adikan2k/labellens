version: 2

models:
  - name: stg_enrich__categories
    description: The model's category for products Open Food Facts' tags do not place.
    columns:
      - name: code
        data_tests: [unique, not_null]
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_categories')
                field: category_id

  - name: stg_enrich__explainers
    description: The model's explainers, one per additive and per common ingredient.
    data_tests:
      - unique_combination:
          arguments:
            columns: [kind, id]
    columns:
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: ["additive", "ingredient"]
      - name: text
        data_tests: [not_null]
