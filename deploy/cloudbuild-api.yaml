# Cloud Build: build the API image from api/Dockerfile and push it to Artifact Registry.
# Used by scripts/deploy_api.py; _IMAGE is passed as a substitution.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "api/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
