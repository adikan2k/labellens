[project]
name = "labellens"
version = "0.1.0"
description = "Open Food Facts as a tested pipeline, knowledge graph, web app and MCP App."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "fastapi[standard]",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pyyaml",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
include = ["api", "pipeline", "scripts", "evals"]
exclude = ["**/node_modules", "**/__pycache__", "web", "data", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["api/tests", "pipeline/tests", "scripts/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -q"
