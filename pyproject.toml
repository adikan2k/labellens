[project]
name = "labellens"
version = "0.1.0"
description = "Open Food Facts as a tested pipeline, knowledge graph, web app and MCP App."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.10.0",
    "certifi>=2026.10.23",
    "fastapi[standard]",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pyyaml",
    "ruff",
]
pipeline = [
    "dagster>=1.13.30",
    "dagster-dbt>=0.29.30",
    "dagster-webserver>=1.13.30",
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
    "duckdb>=2.0.0",
]

[tool.uv]
package = false
# The API image (phase 2) installs with --no-default-groups to skip dbt and Dagster.
default-groups = ["dev", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
include = ["api", "pipeline", "scripts", "evals"]
exclude = ["**/node_modules", "**/__pycache__", "web", "data", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["api/tests", "pipeline/tests", "scripts/tests", "evals/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -q"
# Third-party notice from a transitive dependency of Dagster; nothing to act on here.
filterwarnings = ["ignore:sqlglotrs is deprecated:DeprecationWarning"]
